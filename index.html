<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>十二星座搭配查询</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #26231f;
      --muted: #746b61;
      --line: #ded4c8;
      --paper: #fffaf3;
      --accent: #b34835;
      --accent-2: #1f6f68;
      --gold: #b58128;
      --shadow: 0 18px 45px rgba(77, 55, 36, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(179, 72, 53, 0.12), transparent 28%),
        radial-gradient(circle at 88% 5%, rgba(31, 111, 104, 0.12), transparent 25%),
        linear-gradient(180deg, #fbf7f1 0%, var(--bg) 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 52px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.16;
      font-weight: 800;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .counter {
      flex: 0 0 auto;
      color: var(--accent-2);
      border: 1px solid rgba(31, 111, 104, 0.25);
      padding: 10px 13px;
      border-radius: 8px;
      background: rgba(255, 250, 243, 0.75);
      font-size: 14px;
      font-weight: 700;
    }

    .panel {
      background: rgba(255, 250, 243, 0.88);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
    }

    .birth-details {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding-top: 6px;
    }

    .birth-title {
      grid-column: 1 / -1;
      color: var(--accent-2);
      font-size: 14px;
      font-weight: 900;
      margin-top: 2px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #cfc3b5;
      border-radius: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: #fffdf9;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(31, 111, 104, 0.12);
    }

    .element-picker {
      margin-top: 10px;
    }

    .element-tabs, .sign-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .element-btn, .sign-btn {
      height: 34px;
      min-width: auto;
      padding: 0 11px;
      border-radius: 999px;
      color: var(--accent-2);
      background: rgba(31, 111, 104, 0.1);
      border: 1px solid rgba(31, 111, 104, 0.18);
      font-size: 13px;
      font-weight: 800;
    }

    .element-btn.active, .sign-btn:hover {
      color: white;
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    .sign-options {
      min-height: 34px;
      margin-top: 8px;
    }

    .sign-btn {
      color: var(--accent);
      background: rgba(179, 72, 53, 0.08);
      border-color: rgba(179, 72, 53, 0.18);
    }

    button {
      align-self: end;
      height: 48px;
      min-width: 132px;
      border: none;
      border-radius: 8px;
      color: white;
      background: var(--accent);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.96); }

    .mode-toggle {
      min-width: 48px;
      padding: 0 12px;
      color: var(--accent-2);
      background: rgba(31, 111, 104, 0.12);
      border: 1px solid rgba(31, 111, 104, 0.24);
    }

    .report {
      padding: 34px;
    }

    .report-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0;
      font-size: 31px;
      line-height: 1.25;
    }

    .summary {
      max-width: 760px;
      margin: 15px 0 0;
      color: #514a42;
      font-size: 17px;
      line-height: 1.95;
    }

    .score {
      min-width: 148px;
      padding: 16px;
      border: 1px solid rgba(181, 129, 40, 0.28);
      border-radius: 8px;
      background: #fff6e5;
      text-align: center;
    }

    .score strong {
      display: block;
      color: var(--gold);
      font-size: 32px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .score span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .tag {
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--accent-2);
      background: rgba(31, 111, 104, 0.1);
      font-size: 13px;
      font-weight: 800;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 26px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.48);
      padding: 20px;
    }

    .section.wide {
      grid-column: 1 / -1;
    }

    .section h3 {
      margin: 0 0 10px;
      color: var(--accent-2);
      font-size: 18px;
      line-height: 1.35;
    }

    .section p {
      margin: 0;
      color: #514a42;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .quote {
      margin-top: 22px;
      padding: 20px 22px;
      border-left: 4px solid var(--accent);
      background: rgba(179, 72, 53, 0.07);
      color: #4c352d;
      font-size: 18px;
      line-height: 1.75;
      font-weight: 800;
    }

    .empty {
      padding: 34px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 20px, 1120px);
        padding: 18px 0 34px;
      }

      .topbar, .report-head, .controls, .birth-details, .sections {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
        align-items: start;
      }

      h1 { font-size: 28px; }
      h2 { font-size: 25px; }
      .report { padding: 22px; }
      button { width: 100%; }
      .counter { width: fit-content; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div>
        <h1>十二星座搭配查询</h1>
        <p class="subtitle">分别输入女方星座和男方星座，查看你预设好的长文案报告。</p>
      </div>
      <div class="counter" id="counter">已收录 1 / 144</div>
    </div>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="femaleText">女方星座</label>
          <input id="femaleText" placeholder="例如：白羊" value="白羊" />
          <div class="element-picker" data-target="female">
            <div class="element-tabs" data-role="elements"></div>
            <div class="sign-options" data-role="signs"></div>
          </div>
        </div>
        <div>
          <label for="maleText">男方星座</label>
          <input id="maleText" placeholder="例如：狮子" value="狮子" />
          <div class="element-picker" data-target="male">
            <div class="element-tabs" data-role="elements"></div>
            <div class="sign-options" data-role="signs"></div>
          </div>
        </div>
        <button id="searchBtn">查看报告</button>
        <button class="mode-toggle" id="modeToggle" title="切换男男查询" type="button">♂♂</button>
        <div class="birth-details">
          <div class="birth-title">女方出生信息（可选）</div>
          <div>
            <label for="femaleBirthDate">出生日期</label>
            <input id="femaleBirthDate" type="date" />
          </div>
          <div>
            <label for="femaleBirthTime">出生时间</label>
            <input id="femaleBirthTime" type="time" />
          </div>
          <div>
            <label for="femaleBirthPlace">出生地</label>
            <input id="femaleBirthPlace" placeholder="例如：上海" />
          </div>
          <div class="birth-title">男方出生信息（可选）</div>
          <div>
            <label for="maleBirthDate">出生日期</label>
            <input id="maleBirthDate" type="date" />
          </div>
          <div>
            <label for="maleBirthTime">出生时间</label>
            <input id="maleBirthTime" type="time" />
          </div>
          <div>
            <label for="maleBirthPlace">出生地</label>
            <input id="maleBirthPlace" placeholder="例如：北京" />
          </div>
        </div>
      </div>

      <article class="report" id="report"></article>
    </section>
  </main>

          { heading: "相处中的甜", body: `${copy.sweet}\n\n${female}女真正需要的是${femaleInfo.need}；${male}男真正需要的是${maleInfo.need}。当双方都能给到对方核心需求时，关系会明显变顺。` },
          { heading: "容易出问题的地方", body: problemText(female, male, femaleInfo, maleInfo, copy, "女方", "男方") },
          { heading: "相处忌讳", body: tabooText(female, male, femaleInfo, maleInfo, "女方", "男方") },
          { heading: "渣男渣女指数", body: redFlagIndex(female, male, femaleInfo, maleInfo, "女方", "男方") },
          { heading: "关系建议", body: adviceText(female, male, femaleInfo, maleInfo, copy, "女方", "男方") }
        ],
        quote: `${female}女和${male}男的关键，不是变成同一种人，而是在差异里找到彼此都舒服的相爱方式。`
      };
    }

    const reportEl = document.querySelector("#report");
    const counterEl = document.querySelector("#counter");
    const femaleText = document.querySelector("#femaleText");
    const maleText = document.querySelector("#maleText");
    const modeToggle = document.querySelector("#modeToggle");
    const femaleBirthDate = document.querySelector("#femaleBirthDate");
    const femaleBirthTime = document.querySelector("#femaleBirthTime");
    const femaleBirthPlace = document.querySelector("#femaleBirthPlace");
    const maleBirthDate = document.querySelector("#maleBirthDate");
    const maleBirthTime = document.querySelector("#maleBirthTime");
    const maleBirthPlace = document.querySelector("#maleBirthPlace");
    let queryMode = "straight";

    function initPage() {
      counterEl.textContent = "男女 144 / 男男 144";
    }

    function roleLabels() {
      if (queryMode === "maleMale") {
        return {
          first: "0号男方",
          second: "1号男方",
          firstSuffix: "男",
          secondSuffix: "男"
        };
      }

      return {
        first: "女方",
        second: "男方",
        firstSuffix: "女",
        secondSuffix: "男"
      };
    }

    function applyModeLabels() {
      const labels = roleLabels();
      document.querySelector("label[for='femaleText']").textContent = `${labels.first}星座`;
      document.querySelector("label[for='maleText']").textContent = `${labels.second}星座`;
      document.querySelector("label[for='femaleBirthDate']").textContent = `${labels.first}出生日期`;
      document.querySelector("label[for='femaleBirthTime']").textContent = `${labels.first}出生时间`;
      document.querySelector("label[for='femaleBirthPlace']").textContent = `${labels.first}出生地`;
      document.querySelector("label[for='maleBirthDate']").textContent = `${labels.second}出生日期`;
      document.querySelector("label[for='maleBirthTime']").textContent = `${labels.second}出生时间`;
      document.querySelector("label[for='maleBirthPlace']").textContent = `${labels.second}出生地`;
      document.querySelectorAll(".birth-title")[0].textContent = `${labels.first}出生信息（可选）`;
      document.querySelectorAll(".birth-title")[1].textContent = `${labels.second}出生信息（可选）`;
      femaleText.placeholder = queryMode === "maleMale" ? "例如：天蝎" : "例如：白羊";
      maleText.placeholder = queryMode === "maleMale" ? "例如：双子" : "例如：狮子";
      modeToggle.textContent = queryMode === "maleMale" ? "男女" : "♂♂";
      modeToggle.title = queryMode === "maleMale" ? "切回男女查询" : "切换男男查询";
    }

    function renderElementPickers() {
      document.querySelectorAll(".element-picker").forEach(picker => {
        const target = picker.dataset.target;
        const input = target === "female" ? femaleText : maleText;
        const elementsEl = picker.querySelector("[data-role='elements']");
        const signsEl = picker.querySelector("[data-role='signs']");

        elementsEl.innerHTML = Object.keys(elementGroups).map(element => (
          `<button type="button" class="element-btn" data-element="${element}" data-target="${target}">${element}</button>`
        )).join("");

        signsEl.innerHTML = "";

        elementsEl.querySelectorAll(".element-btn").forEach(button => {
          button.addEventListener("click", () => {
            elementsEl.querySelectorAll(".element-btn").forEach(item => item.classList.remove("active"));
            button.classList.add("active");
            signsEl.innerHTML = elementGroups[button.dataset.element].map(sign => (
              `<button type="button" class="sign-btn" data-sign="${sign}">${sign}</button>`
            )).join("");

            signsEl.querySelectorAll(".sign-btn").forEach(signButton => {
              signButton.addEventListener("click", () => {
                input.value = signButton.dataset.sign;
                if (target === "female") {
                  maleText.focus();
                } else {
                  searchPair();
                }
              });
            });
          });
        });
      });
    }

    function collectBirthInfo() {
      return {
        female: {
          date: femaleBirthDate.value,
          time: femaleBirthTime.value,
          place: femaleBirthPlace.value.trim()
        },
        male: {
          date: maleBirthDate.value,
          time: maleBirthTime.value,
          place: maleBirthPlace.value.trim()
        }
      };
    }

    function formatBirthDate(value) {
      if (!value) return "";
      const [year, month, day] = value.split("-");
      return `${year}年${Number(month)}月${Number(day)}日`;
    }

    function hasBirthBase(person) {
      return Boolean(person.date && person.place);
    }

    function normalizeDegree(value) {
      return ((value % 360) + 360) % 360;
    }

    function degreeToSign(degree) {
      return signByDegree[Math.floor(normalizeDegree(degree) / 30)];
    }

    function toRadians(degree) {
      return degree * Math.PI / 180;
    }

    function toDegrees(radian) {
      return radian * 180 / Math.PI;
    }

    function findCity(place) {
      const cleanPlace = place
        .replace(/\s/g, "")
        .replace(/特别行政区|维吾尔自治区|壮族自治区|回族自治区|自治区|自治州|地区|盟|省|市|区|县|旗|中国/g, "");
      return Object.entries(cityCoordinates)
        .filter(([name]) => cleanPlace === name || cleanPlace.includes(name))
        .sort((a, b) => b[0].length - a[0].length || cleanPlace.lastIndexOf(b[0]) - cleanPlace.lastIndexOf(a[0]))[0];
    }

    function birthDateToUtcDate(person) {
      if (!person.date || !person.time) return null;
      const [year, month, day] = person.date.split("-").map(Number);
      const [hour, minute] = person.time.split(":").map(Number);
      return new Date(Date.UTC(year, month - 1, day, hour - 8, minute || 0, 0));
    }

    function julianDate(date) {
      return date.getTime() / 86400000 + 2440587.5;
    }

    function calculateMoonSign(person) {
      const date = birthDateToUtcDate(person);
      if (!date) return null;
      const days = julianDate(date) - 2451545.0;
      const meanLongitude = normalizeDegree(218.316 + 13.176396 * days);
      const moonAnomaly = normalizeDegree(134.963 + 13.064993 * days);
      const sunAnomaly = normalizeDegree(357.529 + 0.98560028 * days);
      const elongation = normalizeDegree(297.85 + 12.190749 * days);
      const latitudeArg = normalizeDegree(93.272 + 13.22935 * days);
      const longitude = meanLongitude
        + 6.289 * Math.sin(toRadians(moonAnomaly))
        + 1.274 * Math.sin(toRadians(2 * elongation - moonAnomaly))
        + 0.658 * Math.sin(toRadians(2 * elongation))
        + 0.214 * Math.sin(toRadians(2 * moonAnomaly))
        - 0.186 * Math.sin(toRadians(sunAnomaly))
        - 0.114 * Math.sin(toRadians(2 * latitudeArg));
      return degreeToSign(longitude);
    }

    function calculateRisingSign(person) {
      const date = birthDateToUtcDate(person);
      const city = findCity(person.place);
      if (!date || !city) return null;

      const [, coords] = city;
      const jd = julianDate(date);
      const days = jd - 2451545.0;
      const gmst = normalizeDegree(280.46061837 + 360.98564736629 * days);
      const lst = normalizeDegree(gmst + coords.lon);
      const obliquity = 23.439291 - 0.00000036 * days;
      const latitude = coords.lat;
      const ascendant = toDegrees(Math.atan2(
        -Math.cos(toRadians(lst)),
        Math.sin(toRadians(lst)) * Math.cos(toRadians(obliquity)) + Math.tan(toRadians(latitude)) * Math.sin(toRadians(obliquity))
      ));

      return {
        sign: degreeToSign(ascendant),
        city: city[0]
      };
    }

    function birthLine(label, sign, person) {
      const timeText = person.time ? person.time : "未填写";
      const moonSign = calculateMoonSign(person);
      const risingResult = calculateRisingSign(person);
      const cityResult = findCity(person.place);
      const moonText = moonSign ? `${moonSign}座` : "需要填写具体出生时间后才能计算。";
      let risingText = "需要填写具体出生时间后才能计算。";

      if (person.time && !cityResult) {
        risingText = "出生地暂未收录坐标，请换成城市名，例如“上海”“北京”“广州”。";
      } else if (risingResult) {
        risingText = `${risingResult.sign}座（按${risingResult.city}坐标估算）`;
      }

      return `${label}：太阳星座 ${sign}座
出生日期：${formatBirthDate(person.date)}
出生时间：${timeText}
出生地：${person.place}
月亮星座：${moonText}
上升星座：${risingText}`;
    }

    function astroSection(female, male, birthInfo) {
      const parts = [];
      const labels = roleLabels();
      if (hasBirthBase(birthInfo.female)) {
        parts.push(birthLine(labels.first, female, birthInfo.female));
      }
      if (hasBirthBase(birthInfo.male)) {
        parts.push(birthLine(labels.second, male, birthInfo.male));
      }
      if (!parts.length) return null;

      return {
        heading: "上升咨询",
        wide: true,
        body: `${parts.join("\n\n")}\n\n说明：这是本地简化星盘算法，适合做内容工具和初步参考；如果用于专业占星，建议之后接入专业星历库。`
      };
    }

    function clearSearchFields() {
      femaleText.value = "";
      maleText.value = "";
      femaleBirthDate.value = "";
      femaleBirthTime.value = "";
      femaleBirthPlace.value = "";
      maleBirthDate.value = "";
      maleBirthTime.value = "";
      maleBirthPlace.value = "";
      document.querySelectorAll(".element-btn").forEach(button => button.classList.remove("active"));
      document.querySelectorAll(".sign-options").forEach(options => { options.innerHTML = ""; });
      femaleText.focus();
    }

    function showInitialPrompt() {
      const prompt = queryMode === "maleMale"
        ? "男男查询已开启，请在上方输入 0号男方 和 1号男方 的星座。"
        : "请在上方输入星座查询。";
      reportEl.innerHTML = `<div class="empty">${prompt}</div>`;
    }

    function adjustSectionsForMode(data, female, male) {
      const labels = roleLabels();
      if (queryMode !== "maleMale") return data.sections;
      const firstInfo = signInfo[female];
      const secondInfo = signInfo[male];

      return data.sections.map(section => {
        if (section.heading === "女方性格") {
          return { heading: `${labels.first}性格`, body: personalityText(female, "male") };
        }
        if (section.heading === "男方性格") {
          return { heading: `${labels.second}性格`, body: personalityText(male, "male") };
        }
        if (section.heading === "星座月份") {
          return { heading: "星座月份", body: `${female}座：${signInfo[female].date}\n${male}座：${signInfo[male].date}` };
        }
        if (section.heading === "容易出问题的地方") {
          const copy = elementCopy[`${firstInfo.element}|${secondInfo.element}`];
          return { heading: "容易出问题的地方", body: `${problemText(female, male, firstInfo, secondInfo, copy, labels.first, labels.second)}\n\n放在男男关系里，这组还要特别注意“谁来主动定义关系、谁来承担情绪沟通”。如果两个人都习惯把脆弱藏起来，问题会表面很平静，实际越积越深。` };
        }
        if (section.heading === "相处忌讳") {
          return { heading: "相处忌讳", body: tabooText(female, male, firstInfo, secondInfo, labels.first, labels.second) };
        }
        if (section.heading === "渣男渣女指数") {
          return { heading: "风险指数", body: redFlagIndex(female, male, firstInfo, secondInfo, labels.first, labels.second) };
        }
        if (section.heading === "关系建议") {
          const copy = elementCopy[`${firstInfo.element}|${secondInfo.element}`];
          return { heading: "关系建议", body: adviceText(female, male, firstInfo, secondInfo, copy, labels.first, labels.second) };
        }
        return section;
      });
    }

    function renderReport(female, male, birthInfo = collectBirthInfo()) {
      const data = buildReport(female, male);
      const tags = [...data.tags, `组合评价：${ratingLabel(data.score)}`];
      const sections = [...adjustSectionsForMode(data, female, male)];
      sections.unshift(sinSection(female, male));
      const dateIndex = sections.findIndex(section => section.heading === "星座月份");
      sections.splice(dateIndex + 1, 0, bluntMatchSection(female, male));
      const astro = astroSection(female, male, birthInfo);
      if (astro) sections.push(astro);
      const labels = roleLabels();
      reportEl.innerHTML = `
        <div class="report-head">
          <div>
            <div class="eyebrow">${female}${labels.firstSuffix} + ${male}${labels.secondSuffix}</div>
            <h2>${queryMode === "maleMale" ? `${female}男 x ${male}男：男男搭配分析` : data.title}</h2>
            <p class="summary">${data.summary}</p>
            <div class="tags">${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
          </div>
          <div class="score">
            <strong>${data.score}</strong>
            <span>适配指数</span>
          </div>
        </div>
        <div class="sections">
          ${sections.map(section => `
            <section class="section${section.wide ? " wide" : ""}">
              <h3>${section.heading}</h3>
              <p>${section.body}</p>
            </section>
          `).join("")}
        </div>
        <div class="quote">${data.quote}</div>
      `;
    }

    function parseSign(value, roleWord) {
      const text = value.trim().replace(/\s/g, "");
      const directMatch = signs.find(sign => text === sign || text.includes(sign));
      if (directMatch) return directMatch;

      const cleaned = text
        .replace(new RegExp(`${roleWord}$`), "")
        .replace(/星座$/g, "")
        .replace(/座$/g, "");
      return signs.find(sign => cleaned === sign || cleaned.includes(sign));
    }

    function searchPair() {
      const female = parseSign(femaleText.value, roleLabels().firstSuffix);
      const male = parseSign(maleText.value, roleLabels().secondSuffix);

      if (!female || !male) {
        reportEl.innerHTML = `<div class="empty">没有识别到完整组合。女方可以填“白羊”，男方可以填“狮子”。</div>`;
        return;
      }

      renderReport(female, male);
      clearSearchFields();
    }

    document.querySelector("#searchBtn").addEventListener("click", searchPair);
    modeToggle.addEventListener("click", () => {
      queryMode = queryMode === "maleMale" ? "straight" : "maleMale";
      applyModeLabels();
      clearSearchFields();
      showInitialPrompt();
    });
    femaleText.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        maleText.focus();
      }
    });
    maleText.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        searchPair();
      }
    });
    [femaleBirthDate, femaleBirthTime, femaleBirthPlace, maleBirthDate, maleBirthTime, maleBirthPlace].forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") searchPair();
      });
    });

    initPage();
    renderElementPickers();
    clearSearchFields();
    applyModeLabels();
    showInitialPrompt();
  </script>
</body>
